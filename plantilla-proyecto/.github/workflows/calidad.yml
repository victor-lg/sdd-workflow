# Controles de calidad del workflow SDD + IA v1.1 (M26 y M23).
#
# En cada PR contra `main`: mutaciones con Stryker (JS/TS), código que sobra con knip (JS/TS)
# y duplicación nueva con jscpd (cualquier lenguaje). El nombre de cada job es el check que se
# marca como requerido en la regla de `main` (en borrador, `mutaciones` lleva « (borrador)»). El agente no puede modificar este fichero: su
# token no tiene el permiso `workflow` (ADR-0005, caso N5).
#
# Solo `pull_request` (nunca `pull_request_target`) y sin `workflow_dispatch`, por lo mismo
# que seguridad.yml: el agente no puede lanzarlo sobre su rama.
#
# La configuración de Stryker es la de `main`, no la del PR: así un PR no puede bajar su
# propio umbral ni sacar ficheros de `mutate`. Un cambio en ella lo marca R2 checks.py y vale
# después del merge. Límites aceptados (docs/herramientas.md del workflow): la configuración
# del runner de tests y los scripts de package.json salen de la rama (package.json es R2 por
# ser un manifiesto), y el código que lanza `npm test`, también un test, puede leer
# `__STRYKER_ACTIVE_MUTANT__` y fallar a propósito con cada mutante. Eso lo ve la revisión.
#
# Stryker sale de node_modules, instalado con `npm ci` desde el lockfile del proyecto: la
# versión es la que fija el proyecto y la aprobada está en docs/herramientas.md del workflow.
#
# knip y jscpd siguen la misma regla: la configuración es la de `main`. knip sale de
# node_modules, como Stryker; jscpd, de su release de GitHub con la suma fijada aquí, para que
# un manifiesto de la rama no pueda sustituirlo. Ninguno respeta el .gitignore de la rama.
#
# Borrador barato, listo completo (VIC-33): mientras el PR está en borrador, `mutaciones` valida
# la configuración pero no lanza Stryker, y lo dice con un aviso; corre entero al marcarlo listo
# (`ready_for_review`) y en cada push posterior. El job no se salta nunca (un check requerido
# saltado cuenta como superado) y en borrador se llama `mutaciones (borrador)`: el verde barato
# nunca lleva el nombre del check requerido. El nombre y Stryker salen del evento, como en el
# job `tests` del ejemplo de tests: un run de borrador relanzado conserva los dos. knip y jscpd
# son baratos y corren siempre.

name: calidad

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: calidad-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # La configuración de Stryker sale de aquí. Con la ref completa: `origin/main` resolvería
  # antes una etiqueta llamada así (refs/tags/origin/main), que puede empujar la rama.
  BASE: refs/remotes/origin/${{ github.base_ref }}
  # Git no sustituye objetos con refs/replace al leer la historia.
  GIT_NO_REPLACE_OBJECTS: "1"

jobs:
  mutaciones:
    name: ${{ github.event.pull_request.draft && 'mutaciones (borrador)' || 'mutaciones' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Fijada por SHA (v7.0.1, 2026-07-17), igual que en sdd.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Sin package.json no hay herramienta de mutación (M26: mutantes a mano en R1 y R2) y el
      # job pasa con aviso. Con package.json, Stryker tiene que estar en devDependencies y la
      # configuración, tener `thresholds.break` mayor que 0: sin él, Stryker nunca falla.
      - name: Configuración de Stryker de main
        id: preparar
        run: |
          git rev-parse --verify --quiet "$BASE^{commit}" > /dev/null || { echo "::error::Git no encuentra $BASE"; exit 1; }
          if [ ! -f package.json ]; then
            if git cat-file -e "$BASE:package.json" 2>/dev/null; then
              echo "::error::main tiene package.json y la rama no: sin él no se mutaría nada"; exit 1
            fi
            echo "::warning::Sin package.json: este proyecto no tiene herramienta de mutación en la CI."
            echo "stryker=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 -I -c '
          import json, sys
          dev = json.load(open("package.json", encoding="utf-8")).get("devDependencies") or {}
          sys.exit(0 if "@stryker-mutator/core" in dev else 1)
          ' || { echo "::error::package.json no tiene @stryker-mutator/core en devDependencies"; exit 1; }
          if git cat-file -e "$BASE:stryker.config.json" 2>/dev/null; then
            git show "$BASE:stryker.config.json" > "$RUNNER_TEMP/stryker.config.json"
          elif git ls-tree --name-only "$BASE" | grep -Eqx '\.?stryker\.conf(ig)?\.(json|js|mjs|cjs)'; then
            # Con otra configuración en `main`, la de la rama no puede sustituirla.
            echo "::error::main tiene una configuración de Stryker que no es stryker.config.json: la CI solo usa esa"; exit 1
          elif [ -f stryker.config.json ]; then
            # Solo hasta que llegue a `main`: el PR que la añade es R2.
            echo "::warning::main no tiene stryker.config.json: se usa el de la rama."
            cp stryker.config.json "$RUNNER_TEMP/stryker.config.json"
          else
            echo "::error::Falta stryker.config.json (en main y en la rama)"; exit 1
          fi
          python3 -I -c '
          import json, sys
          umbral = (json.load(open(sys.argv[1], encoding="utf-8")).get("thresholds") or {}).get("break")
          sys.exit(0 if type(umbral) in (int, float) and umbral > 0 else 1)
          ' "$RUNNER_TEMP/stryker.config.json" || { echo "::error::stryker.config.json necesita thresholds.break mayor que 0"; exit 1; }
          echo "stryker=si" >> "$GITHUB_OUTPUT"

      # Fijada por SHA (v7.1.0, 2026-10-08). Sin caché: la de un PR la escribe código de la rama.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.preparar.outputs.stryker == 'si' && !github.event.pull_request.draft
        with:
          node-version: 24
          package-manager-cache: false

      # VIC-44: vCPU del runner (en los repos privados, 2; en los públicos, 4), para leer la
      # alarma de mutantes por tiempo. Desde VIC-53, también el modelo de CPU: con 4 vCPU los
      # mutantes por tiempo varían entre jobs, y el modelo es una de las variables que se miden.
      # Corre antes que el código de la rama.
      - name: CPU del runner
        if: steps.preparar.outputs.stryker == 'si' && !github.event.pull_request.draft
        run: |
          nproc
          modelo=$(sed -n '/^model name/{s/^model name[[:space:]]*: //p;q}' /proc/cpuinfo)
          echo "Modelo de CPU: ${modelo:-desconocido (sin model name en /proc/cpuinfo)}"

      # --force: ejecuta todos los mutantes aunque la rama traiga un fichero incremental.
      # Con cero mutantes la puntuación es NaN y Stryker no aplica el umbral: falla aquí.
      # Un mutante Ignored no cuenta en la puntuación: lo dejan así un comentario
      # `// Stryker disable` en el código o `ignoreStatic`. Con uno solo, falla: lo que no se
      # deba mutar se saca con `mutate`, en la configuración de `main`. Se mira en el informe
      # JSON de Stryker, no en el texto del diff, que tenía formas de esconderse (G4).
      #
      # Alarma de mutantes por tiempo (VIC-44; dentro de este paso desde VIC-45): con 2 vCPU
      # (repo privado o runner propio) los mutantes por tiempo suben a decenas, Stryker los
      # cuenta como detectados y la puntuación se infla sin que el check se ponga rojo. Después
      # de Stryker se lista cada mutante Timeout y se calcula la puntuación contándolos todos
      # como supervivientes: muertos / (muertos + por tiempo + supervivientes + sin cobertura),
      # en %. Falla si baja del mínimo, que es el menor de PUNTUACION_MINIMA_SIN_TIEMPO y
      # `thresholds.break`: con un `break` más bajo, la alarma no exige más que el umbral sin
      # mutantes por tiempo. Se cuenta aunque Stryker haya fallado. Falla cerrado: la cuenta se
      # hace en Python, y cualquier error al leer el informe, la configuración o el mínimo hace
      # fallar el paso.
      #
      # Lo que corre después de Stryker se protege del código de la rama (los tests, con los
      # permisos del runner):
      # - va en este paso, y no en uno posterior: $GITHUB_ENV y $GITHUB_PATH, que un test
      #   puede escribir, solo valen para los pasos siguientes;
      # - usa rutas absolutas (/usr/bin/python3 -I, /usr/bin/grep): un test puede dejar un
      #   ejecutable en una carpeta del PATH en la que se pueda escribir (la de Node, por ejemplo);
      # - la ruta del informe y el mínimo se calculan antes de Stryker: un test puede reescribir
      #   la configuración de $RUNNER_TEMP;
      # - todo el script va entre llaves, que bash lee enteras antes de ejecutar: un test puede
      #   reescribir el fichero del script mientras corre, y sin ellas bash leería lo nuevo;
      # - un informe en el que no se puede escribir hace fallar el paso (VIC-53): un test puede
      #   dejar el suyo sin permiso de escritura, Stryker no puede escribir encima, sale con 0
      #   y se leería el falso;
      # - también falla si la salida de Stryker trae un error del reporter json (VIC-53): un
      #   test puede bajar con prlimit el límite de ficheros abiertos del proceso de Stryker y
      #   dejar un informe falso que sí se puede escribir; Stryker anota EMFILE y sale con 0;
      # - el log de Stryker se abre en el descriptor 5 antes de lanzarlo (Stryker no lo
      #   hereda: `5>&-`); tee escribe en /dev/fd/5 y los grep leen de ahí, no de la ruta: un
      #   test puede borrar $RUNNER_TEMP/stryker.log y dejar otro sin el error (VIC-53).
      #   Un test que mate a tee ya hace fallar el paso: sin pipefail, la tubería sale con el
      #   estado de tee y `bash -e` corta (medido en VIC-53).
      # Ficheros y sustituciones salen del código de la rama: se imprimen entre stop-commands,
      # como la salida de Stryker. Después del token, un aviso MEDIDA con nproc, los mutantes
      # por tiempo y la puntuación contándolos como supervivientes (VIC-53): son números que
      # calcula el paso, no texto de la rama, para comparar jobs: la cuenta los escribe en el
      # descriptor 3, que va a la variable `medida`, y su salida normal sigue en el log por el
      # 4 (`3>&1 1>&4` dentro de `$(…)` y `4>&1` en las llaves de fuera), dentro de los
      # stop-commands. Sin el 4, la lista de mutantes por tiempo acabaría en la variable.
      # Límites aceptados, como `__STRYKER_ACTIVE_MUTANT__` (cabecera), que ve la revisión: un
      # proceso que un test deje vivo y reescriba el informe antes de leerlo o escriba en el
      # log del paso, un test que use el sudo sin contraseña del runner, que con root puede
      # saltarse cualquiera de estas defensas, y cualquier otra forma de engañar al paso desde
      # el mismo usuario (los tests corren con el del runner; VIC-53 cierra esta familia).
      # Cambiar el mínimo es R2.
      - name: Stryker
        id: stryker
        if: steps.preparar.outputs.stryker == 'si' && !github.event.pull_request.draft
        env:
          PUNTUACION_MINIMA_SIN_TIEMPO: "90"
        run: |
          {
          cpus=$(/usr/bin/nproc)
          npm ci --ignore-scripts --no-audit --no-fund
          [ -x node_modules/.bin/stryker ] || { echo "::error::npm ci no instaló Stryker"; exit 1; }
          informe=$(python3 -I -c '
          import json, sys
          print((json.load(open(sys.argv[1], encoding="utf-8")).get("jsonReporter") or {}).get("fileName") or "reports/mutation/mutation.json")
          ' "$RUNNER_TEMP/stryker.config.json")
          minimo=$(python3 -I -c '
          import json, sys
          from decimal import Decimal
          minimo = Decimal(sys.argv[2])
          if not minimo.is_finite() or not 0 < minimo <= 100:
              sys.exit("PUNTUACION_MINIMA_SIN_TIEMPO tiene que ser un número mayor que 0 y no mayor que 100")
          umbral = (json.load(open(sys.argv[1], encoding="utf-8")).get("thresholds") or {}).get("break")
          if type(umbral) not in (int, float) or not 0 < umbral <= 100:
              sys.exit("thresholds.break tiene que ser un número mayor que 0 y no mayor que 100")
          print(min(minimo, Decimal(str(umbral))))
          ' "$RUNNER_TEMP/stryker.config.json" "$PUNTUACION_MINIMA_SIN_TIEMPO") || { echo "::error::No se ha podido calcular el mínimo de la alarma de mutantes por tiempo"; exit 1; }
          echo "Mínimo de la alarma de mutantes por tiempo: $minimo (el menor de $PUNTUACION_MINIMA_SIN_TIEMPO y thresholds.break)."
          rm -f "$informe"
          token=$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')
          echo "::stop-commands::$token"
          exec 5> "$RUNNER_TEMP/stryker.log"
          node_modules/.bin/stryker run "$RUNNER_TEMP/stryker.config.json" --force --reporters clear-text,json 5>&- 2>&1 | tee /dev/fd/5
          estado=${PIPESTATUS[0]}
          alarma=0
          medida=
          solo_lectura=0
          error_json=0
          if [ -f "$informe" ] && [ ! -w "$informe" ]; then
            # Stryker no ha podido escribir encima: el informe que hay no es el suyo.
            solo_lectura=1
          elif /usr/bin/grep -Eq "An error occurred during '[^']+' on reporter 'json'" /dev/fd/5; then
            # Stryker no ha podido escribir el informe y sale como si nada: el que haya no es el suyo.
            error_json=1
          elif [ -f "$informe" ]; then
            { medida=$(/usr/bin/python3 -I -c '
          import json, os, sys
          from decimal import Decimal
          minimo = Decimal(sys.argv[2])
          informe = json.load(open(sys.argv[1], encoding="utf-8"))
          cuenta = {"Killed": 0, "Timeout": 0, "Survived": 0, "NoCoverage": 0}
          for f, datos in sorted(informe["files"].items()):
              for m in datos["mutants"]:
                  estado = m["status"]
                  if estado in cuenta:
                      cuenta[estado] += 1
                  if estado != "Timeout":
                      continue
                  linea = (m.get("location") or {}).get("start", {}).get("line")
                  mutador = m.get("mutatorName")
                  sustitucion = m.get("replacement")
                  print(f"{f}:{linea} {mutador}: {sustitucion!r}")
          validos = sum(cuenta.values())
          if validos == 0:
              sys.exit("El informe no tiene mutantes válidos")
          muertos = cuenta["Killed"]
          por_tiempo = cuenta["Timeout"]
          puntuacion = Decimal(muertos) * 100 / validos
          print(f"Mutantes por tiempo: {por_tiempo}")
          print(f"Puntuación contándolos como supervivientes: {muertos}/{validos} = {puntuacion:.2f} (mínimo {minimo})")
          os.write(3, f"{por_tiempo} {muertos} {validos} {puntuacion:.2f}".encode())
          sys.exit(3 if puntuacion < minimo else 0)
          ' "$informe" "$minimo" 3>&1 1>&4) || alarma=$?; } 4>&1
          fi
          echo "::$token::"
          if [ "$solo_lectura" -eq 1 ]; then
            echo "::error::El informe JSON de Stryker ($informe) no se puede escribir: Stryker no ha podido dejar el suyo, así que el que hay lo ha dejado otro proceso (un test, por ejemplo) y no se cuenta"; exit 1
          fi
          if [ "$error_json" -eq 1 ]; then
            echo "::error::Stryker no ha podido escribir el informe JSON (el error del reporter json, en su salida, arriba) y no falla por eso: el que haya en $informe no es el suyo y no se cuenta"; exit 1
          fi
          # Números que calcula este paso, no texto de la rama (VIC-53).
          if [[ "$cpus" =~ ^[0-9]+$ && "$medida" =~ ^([0-9]+)\ ([0-9]+)\ ([0-9]+)\ ([0-9]+\.[0-9]{2})$ ]]; then
            echo "::notice title=MEDIDA::nproc $cpus, mutantes por tiempo ${BASH_REMATCH[1]}, puntuación contándolos como supervivientes ${BASH_REMATCH[2]}/${BASH_REMATCH[3]} = ${BASH_REMATCH[4]}"
          fi
          if /usr/bin/grep -q "Final mutation score of NaN" /dev/fd/5; then
            echo "::error::Stryker no ha probado ningún mutante: revisa mutate en stryker.config.json"; exit 1
          fi
          if [ ! -f "$informe" ]; then
            if [ "$estado" -eq 0 ]; then
              echo "::error::Stryker no ha dejado el informe JSON en $informe: la alarma de mutantes por tiempo no puede comprobarse"; exit 1
            fi
            # Stryker ya ha fallado: sin informe no hay mutantes que contar.
            exit "$estado"
          fi
          # La alarma y los Ignored se comprueban los dos antes de salir, para ver las dos causas.
          fallo=0
          if [ "$alarma" -eq 3 ]; then
            echo "::error::Contando como supervivientes los mutantes por tiempo, la puntuación baja del mínimo (la cuenta y la lista, arriba). Stryker los cuenta como detectados, así que su puntuación está inflada y el check no ve los tests debilitados. Suele ser un runner con menos CPU (mira el paso «CPU del runner»). Ver docs/herramientas.md del workflow, sección Stryker."
            fallo=1
          elif [ "$alarma" -ne 0 ]; then
            echo "::error::No se ha podido leer el informe JSON de Stryker (salida $alarma): la alarma de mutantes por tiempo no puede comprobarse"
            fallo=1
          else
            echo "Puntuación contando los mutantes por tiempo como supervivientes: dentro del mínimo."
          fi
          ignorados=0
          /usr/bin/python3 -I -c '
          import json, sys
          def mensaje(texto):
              return str(texto).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          def propiedad(texto):
              return mensaje(texto).replace(",", "%2C").replace(":", "%3A")
          informe = json.load(open(sys.argv[1], encoding="utf-8"))
          ignorados = [(f, (m.get("location") or {}).get("start", {}).get("line"), m.get("statusReason") or "")
                       for f, datos in informe["files"].items() for m in datos["mutants"] if m["status"] == "Ignored"]
          for f, linea, motivo in ignorados:
              print(f"::error file={propiedad(f)},line={propiedad(linea)}::Mutante ignorado ({mensaje(motivo)})")
          sys.exit(4 if ignorados else 0)
          ' "$informe" || ignorados=$?
          if [ "$ignorados" -eq 4 ]; then
            echo "::error::Hay mutantes Ignored: no cuentan en la puntuación"; fallo=1
          elif [ "$ignorados" -ne 0 ]; then
            echo "::error::No se ha podido leer el informe JSON de Stryker (salida $ignorados): los mutantes Ignored no pueden comprobarse"; fallo=1
          fi
          [ "$fallo" -eq 0 ] || exit 1
          exit "$estado"
          }

      - name: Aviso de borrador
        if: steps.preparar.outputs.stryker == 'si' && github.event.pull_request.draft
        run: |
          echo "::warning::PR en borrador: Stryker no ha corrido. Corre al marcarlo listo (gh pr ready) y en cada push posterior."

  codigo-sobrante:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Fijada por SHA (v7.0.1, 2026-07-17), igual que en sdd.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Sin package.json no es un proyecto JS/TS y el job pasa con aviso, como `mutaciones`.
      # knip mezcla `package.json#knip` de la rama con el fichero que se le pasa
      # (`create-options.js` de la 6.45.1): con esa clave, falla. Las reglas en "warn" solo
      # avisan; en "error", fallan. Pasar a "error" es un cambio de la configuración de main (R2).
      - name: Configuración de knip de main
        id: preparar
        run: |
          git rev-parse --verify --quiet "$BASE^{commit}" > /dev/null || { echo "::error::Git no encuentra $BASE"; exit 1; }
          if [ ! -f package.json ]; then
            if git cat-file -e "$BASE:package.json" 2>/dev/null; then
              echo "::error::main tiene package.json y la rama no: sin él no se analizaría nada"; exit 1
            fi
            echo "::warning::Sin package.json: este proyecto no es JS/TS y no pasa por knip."
            echo "knip=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 -I -c '
          import json, sys
          paquete = json.load(open("package.json", encoding="utf-8"))
          if "knip" not in (paquete.get("devDependencies") or {}):
              sys.exit("::error::package.json no tiene knip en devDependencies")
          if "knip" in paquete:
              sys.exit("::error::package.json tiene la clave knip: knip la mezcla con la configuración de main")
          '
          if git cat-file -e "$BASE:knip.json" 2>/dev/null; then
            git show "$BASE:knip.json" > "$RUNNER_TEMP/knip.json"
          elif git ls-tree --name-only "$BASE" | grep -Eqx '\.?knip\.jsonc?|knip(\.config)?\.[jt]s'; then
            # Con otra configuración en `main`, la de la rama no puede sustituirla.
            echo "::error::main tiene una configuración de knip que no es knip.json: la CI solo usa esa"; exit 1
          elif [ -f knip.json ]; then
            # Solo hasta que llegue a `main`: el PR que la añade es R2.
            echo "::warning::main no tiene knip.json: se usa el de la rama."
            cp knip.json "$RUNNER_TEMP/knip.json"
          else
            echo "::error::Falta knip.json (en main y en la rama)"; exit 1
          fi
          python3 -I -c '
          import json, sys
          sys.exit(0 if isinstance(json.load(open(sys.argv[1], encoding="utf-8")), dict) else 1)
          ' "$RUNNER_TEMP/knip.json" || { echo "::error::knip.json tiene que ser un objeto JSON"; exit 1; }
          echo "knip=si" >> "$GITHUB_OUTPUT"

      # Fijada por SHA (v7.1.0, 2026-10-08). Sin caché: la de un PR la escribe código de la rama.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.preparar.outputs.knip == 'si'
        with:
          node-version: 24
          package-manager-cache: false

      # Solo informa: nunca --fix. Sale con 1 si hay hallazgos de una regla en "error" y con 2
      # si no puede cargar la configuración. --no-gitignore: el .gitignore es de la rama.
      # Como en los pasos de Stryker y jscpd, ::stop-commands:: con un token al azar: la salida
      # de la herramienta lleva nombres de fichero de la rama, que podrían inyectar anotaciones.
      - name: knip
        if: steps.preparar.outputs.knip == 'si'
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          [ -x node_modules/.bin/knip ] || { echo "::error::npm ci no instaló knip"; exit 1; }
          token=$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')
          echo "::stop-commands::$token"
          set +e
          node_modules/.bin/knip --config "$RUNNER_TEMP/knip.json" --no-gitignore
          estado=$?
          set -e
          echo "::$token::"
          exit "$estado"

  duplicados:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # jscpd 5.4.3 (2026-11-08), binario para Linux x64 con glibc. La suma es la de la release
      # (checksums.txt), copiada aquí: subir de versión cambia las dos líneas y es R2.
      JSCPD_URL: https://github.com/kucherenko/jscpd/releases/download/v5.4.3/jscpd-linux-x64-gnu.tar.gz
      JSCPD_SHA256: a19d719331b21a047a7537f982566dabcf6d6e5f51581c3b80d9c420979cc92c
    steps:
      # Fijada por SHA (v7.0.1, 2026-07-17), igual que en sdd.yml. Con toda la historia:
      # --baseline-from-ref saca `main` a un worktree temporal.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # jscpd busca .jscpd.json, .config/jscpd.json, .config/.jscpd.json y `package.json#jscpd`;
      # con --config usa ese fichero, y la clave de package.json, por si acaso, hace fallar.
      # Sin --semantic ni sus claves: enviaría el código a un modelo o a una API externa. La
      # configuración solo admite las claves de la lista: el resto (tamaños, rutas, umbrales,
      # anotaciones) vaciaría el control.
      # Un comentario que excluye código (cualquier forma de ignore de jscpd) hace fallar el
      # job, como un mutante Ignored. Se busca con git grep en el árbol de la rama, no en el diff,
      # con [:] para que este fichero, que va en el árbol, no se encuentre a sí mismo.
      # También un .ignore en cualquier carpeta (jscpd lo respeta con --no-gitignore) y el código
      # que no es UTF-8 (jscpd lo salta sin avisar): medido en el PR 3 de VIC-21.
      - name: Configuración de jscpd de main
        id: preparar
        run: |
          git rev-parse --verify --quiet "$BASE^{commit}" > /dev/null || { echo "::error::Git no encuentra $BASE"; exit 1; }
          if git cat-file -e "$BASE:.jscpd.json" 2>/dev/null; then
            git show "$BASE:.jscpd.json" > "$RUNNER_TEMP/.jscpd.json"
          elif git cat-file -e "$BASE:.config/jscpd.json" 2>/dev/null || git cat-file -e "$BASE:.config/.jscpd.json" 2>/dev/null; then
            echo "::error::main tiene una configuración de jscpd que no es .jscpd.json: la CI solo usa esa"; exit 1
          elif [ -f .jscpd.json ]; then
            # Solo hasta que llegue a `main`: el PR que la añade es R2.
            echo "::warning::main no tiene .jscpd.json: se usa el de la rama."
            cp .jscpd.json "$RUNNER_TEMP/.jscpd.json"
          else
            echo "::error::Falta .jscpd.json (en main y en la rama)"; exit 1
          fi
          python3 -I -c '
          import json, os, sys
          config = json.load(open(sys.argv[1], encoding="utf-8"))
          if not isinstance(config, dict):
              sys.exit("::error::.jscpd.json tiene que ser un objeto JSON")
          fijas = [c for c in config if c not in ("$schema", "ignore", "format", "minTokens", "minLines")]
          if fijas:
              sys.exit("::error::.jscpd.json no puede llevar " + ", ".join(sorted(fijas)) + ": solo admite ignore, format, minTokens y minLines; la CI fija lo demás y no usa el modo semantic")
          if os.path.isfile("package.json") and "jscpd" in json.load(open("package.json", encoding="utf-8")):
              sys.exit("::error::package.json tiene la clave jscpd: la configuración es .jscpd.json, la de main")
          ' "$RUNNER_TEMP/.jscpd.json"
          git grep --text -i -l -z -E -e 'jscpd[:]ignore' HEAD -- > "$RUNNER_TEMP/silenciadores" || [ $? -eq 1 ]
          git ls-tree -r -z --name-only HEAD > "$RUNNER_TEMP/arbol"
          python3 -I -c '
          import os, sys
          def limpio(texto):
              texto = texto.encode("utf-8", "surrogateescape").decode("utf-8", "replace")
              return texto.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A").replace(",", "%2C").replace(":", "%3A")
          def nombres(fichero):
              return [os.fsdecode(f) for f in open(fichero, "rb").read().split(b"\0") if f]
          silenciadores = [f.removeprefix("HEAD:") for f in nombres(sys.argv[1])]
          arbol = nombres(sys.argv[2])
          ignores = [f for f in arbol if os.path.basename(f) == ".ignore"]
          codigo = (".js", ".mjs", ".cjs", ".jsx", ".ts", ".mts", ".cts", ".tsx", ".vue", ".svelte", ".astro",
                    ".py", ".pyi", ".pyw", ".rb", ".erb", ".go", ".rs", ".java", ".kt", ".kts", ".scala",
                    ".groovy", ".gradle", ".clj", ".cljs", ".ex", ".exs", ".erl", ".hs", ".ml", ".fs", ".jl",
                    ".r", ".pl", ".pm", ".lua", ".dart", ".zig", ".nim", ".c", ".h", ".cc", ".cpp", ".cxx",
                    ".hh", ".hpp", ".hxx", ".m", ".mm", ".cs", ".vb", ".php", ".swift", ".sh", ".bash",
                    ".zsh", ".ps1", ".css", ".scss", ".sass", ".less", ".html", ".sql", ".tf", ".hcl")
          no_utf8 = []
          for f in arbol:
              try:
                  f.encode("utf-8")
              except UnicodeEncodeError:
                  no_utf8.append(f)
                  continue
              if f.lower().endswith(codigo) and os.path.isfile(f) and not os.path.islink(f):
                  datos = open(f, "rb").read()
                  try:
                      datos.decode("utf-8")
                  except UnicodeDecodeError:
                      no_utf8.append(f)
                      continue
                  if b"\0" in datos:
                      no_utf8.append(f)
          for f in silenciadores:
              print(f"::error file={limpio(f)}::Comentario de jscpd que excluye una región")
          for f in ignores:
              print(f"::error file={limpio(f)}::jscpd no analiza lo que lista un .ignore")
          if silenciadores:
              print("::error::Hay comentarios que esconden código a jscpd: lo que no se deba analizar se saca con ignore, en la configuración de main")
          for f in no_utf8:
              print(f"::error file={limpio(f)}::El nombre o el contenido no es UTF-8, o lleva NUL: jscpd no lo analiza")
          if no_utf8:
              print("::error::Hay código que no es UTF-8 o lleva NUL, o un nombre que no es UTF-8: jscpd lo salta sin avisar; pásalo a UTF-8")
          if ignores:
              print("::error::Hay ficheros .ignore: jscpd los respeta aunque no use el .gitignore; lo que no se deba analizar se saca con ignore, en la configuración de main")
          sys.exit(1 if silenciadores or ignores or no_utf8 else 0)
          ' "$RUNNER_TEMP/silenciadores" "$RUNNER_TEMP/arbol"

      - name: Instalar jscpd
        id: instalar
        run: |
          [ "$(uname -m)" = x86_64 ] || { echo "::error::El binario fijado es para x86_64, no para $(uname -m)"; exit 1; }
          curl --proto '=https' -sSfL --retry 3 -o "$RUNNER_TEMP/jscpd.tar.gz" "$JSCPD_URL"
          echo "$JSCPD_SHA256  $RUNNER_TEMP/jscpd.tar.gz" | sha256sum --check --strict --quiet - || { echo "::error::La suma de jscpd no coincide con la fijada"; exit 1; }
          mkdir -p "$RUNNER_TEMP/jscpd"
          tar -xzf "$RUNNER_TEMP/jscpd.tar.gz" -C "$RUNNER_TEMP/jscpd" jscpd

      # Falla con un solo clon que no esté en `main`; los heredados no cuentan. La base, con la
      # ref completa. --no-gitignore: el .gitignore es de la rama. --max-size: sin ella, jscpd salta
      # los ficheros de más de 1 MB; --cross-formats js-ts: sin ella, una copia de un .js en un .ts
      # no cuenta (medido en el PR 3 de VIC-21).
      - name: jscpd
        run: |
          token=$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')
          echo "::stop-commands::$token"
          set +e
          "$RUNNER_TEMP/jscpd/jscpd" . --config "$RUNNER_TEMP/.jscpd.json" --no-gitignore \
            --baseline-from-ref "$BASE" --fail-on-new-clones --max-size 200mb --cross-formats js-ts \
            --reporters console,json --output "$RUNNER_TEMP/jscpd-informe"
          estado=$?
          set -e
          echo "::$token::"
          exit "$estado"

      # Complejidad, código muerto y salud: solo como informe, no bloquea.
      - name: Informe de salud de jscpd
        if: ${{ !cancelled() && steps.preparar.outcome == 'success' && steps.instalar.outcome == 'success' }}
        run: |
          token=$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')
          echo "::stop-commands::$token"
          set +e
          "$RUNNER_TEMP/jscpd/jscpd" . --config "$RUNNER_TEMP/.jscpd.json" --no-gitignore --max-size 200mb --cross-formats js-ts --dashboard
          estado=$?
          set -e
          echo "::$token::"
          [ "$estado" -eq 0 ] || echo "::warning::El informe de salud de jscpd ha salido con error; no bloquea."
