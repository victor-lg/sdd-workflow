# Vuelve a lanzar `checks-sdd` al aprobar, pedir cambios o retirar una aprobación (VIC-56, ADR-0009 §3.4).
#
# En R2, `checks-sdd` solo pasa con la aprobación de la persona sobre la cabeza del PR. El ruleset exige
# en verde la última ejecución de `checks-sdd` de cada evento: si `pull_request_review` lo ejecutara por
# su cuenta, tras aprobar seguiría en rojo la última de `pull_request` y el PR quedaría bloqueado (prueba
# en la calculadora, sdd-workflow#72). Por eso sdd.yml solo corre con `pull_request`, y este workflow
# vuelve a lanzar su última ejecución para la cabeza: checks.py vuelve a leer las reviews en ese momento.
#
# No hace checkout ni ejecuta nada del PR. Los datos del evento entran por variables de entorno y se
# validan antes de usarlos. Su único permiso es `actions: write`, el que pide volver a lanzar una ejecución.
# El job no se llama `checks-sdd`: no es un check requerido. Si falla, el PR sigue bloqueado, nunca abierto.
#
# En un PR de un fork, el token de `pull_request_review` es de solo lectura: falla y pide relanzarlo a mano.

name: sdd-relanzar

on:
  # «Changes requested» es un `submitted`: también relanza, y el check vuelve a rojo.
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  actions: write

# Una por PR y sin cancelar: si llegan dos reviews seguidas, la segunda espera a que la primera relance y
# vuelve a relanzar, así que la última ejecución lee la última review.
concurrency:
  group: sdd-relanzar-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  relanzar-checks-sdd:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Si la última ejecución sigue en curso, espera a que termine y vuelve a buscar la última (una nueva
      # la cancela por `concurrency`): relanzarla antes podría dejar una que leyó las reviews antes de esta.
      # Luego la relanza siempre, aunque haya terminado después de la review: no se sabe cuándo las leyó.
      - name: Volver a lanzar checks-sdd
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          ESPERA: "10"
          LIMITE: "600"
        run: |
          set -euo pipefail
          if [ "$PR_BASE" != "main" ]; then echo "La base del PR no es main: sdd.yml no corre en él y no hay nada que relanzar."; exit 0; fi
          if [ "$PR_HEAD_REPO" != "$REPO" ]; then
            echo "::error::El PR viene de un fork: con pull_request_review el token es de solo lectura y no puedo relanzar checks-sdd. Relánzalo a mano: en la pestaña Checks del PR, la última ejecución de checks-sdd del evento pull_request, «Re-run all jobs»."
            exit 1
          fi
          if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ && "$PR_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then echo "::error::El número o la cabeza del PR no tienen el formato esperado"; exit 1; fi
          limite=$((SECONDS + LIMITE))
          while :; do
            ultima=$(gh api "repos/$REPO/actions/workflows/sdd.yml/runs?event=pull_request&head_sha=$PR_HEAD_SHA&per_page=100" | python3 -I -c '
          import json, os, sys
          pr, cabeza = int(os.environ["PR_NUMBER"]), os.environ["PR_HEAD_SHA"]
          runs = [r for r in json.load(sys.stdin)["workflow_runs"]
                  if r.get("event") == "pull_request" and r.get("head_sha") == cabeza
                  and any(p.get("number") == pr for p in r.get("pull_requests") or [])]
          if runs:
              r = max(runs, key=lambda r: r["id"])
              print(r["id"], r["status"])
          ')
            if [ -n "$ultima" ]; then read -r id estado <<< "$ultima"; else id=""; estado="ninguna"; fi
            if [ "$estado" = "completed" ]; then break; fi
            if [ "$SECONDS" -ge "$limite" ]; then
              echo "::error::La última ejecución de checks-sdd (pull_request) para ${PR_HEAD_SHA:0:12} sigue en «$estado» tras ${LIMITE} s: no la relanzo. Relánzala a mano cuando termine (pestaña Checks del PR, «Re-run all jobs»)."
              exit 1
            fi
            echo "Última ejecución de checks-sdd para ${PR_HEAD_SHA:0:12}: ${id:-ninguna} ($estado). Espero ${ESPERA} s."
            sleep "$ESPERA"
          done
          if ! gh run rerun "$id" --repo "$REPO"; then
            echo "::error::GitHub no me deja relanzar la ejecución $id de checks-sdd. Relánzala a mano (pestaña Checks del PR, «Re-run all jobs»)."
            exit 1
          fi
          echo "Relanzada la ejecución $id de checks-sdd para ${PR_HEAD_SHA:0:12}."
