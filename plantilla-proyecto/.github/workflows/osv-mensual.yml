# Tarea mensual de osv-scanner del workflow SDD + IA v1.1 (M38; docs/herramientas.md del
# workflow). El día 1 de cada mes, sobre `main`: si encuentra una vulnerabilidad conocida
# en las dependencias, la ejecución falla y GitHub avisa por correo. No abre issues.
#
# Va aparte de seguridad.yml, y su job no se llama como ningún check requerido: así,
# lanzarla a mano sobre otra rama no cambia el resultado de los checks de un PR. Solo
# corre sobre `main`, con la configuración de `main`. Mismas opciones, versión y suma
# que el job `osv-scanner` de seguridad.yml: se suben a la vez.

name: osv-mensual

on:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  osv-mensual:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Fijada por SHA (v7.0.1, 2026-07-17), igual que en sdd.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar osv-scanner 2.7.1
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL -o osv-scanner https://github.com/google/osv-scanner/releases/download/v2.7.1/osv-scanner_linux_amd64
          echo "fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner

      # El osv-scanner.toml de la raíz de `main`, o ninguno: con --config no lee los de
      # cada carpeta.
      - name: osv-scanner sobre los ficheros de bloqueo
        run: |
          if [ -f osv-scanner.toml ] && [ ! -L osv-scanner.toml ]; then cp osv-scanner.toml "$RUNNER_TEMP/osv-scanner.toml"; else : > "$RUNNER_TEMP/osv-scanner.toml"; fi
          "$RUNNER_TEMP/osv-scanner" scan source -r --no-ignore --allow-no-lockfiles \
            --no-call-analysis=all --config "$RUNNER_TEMP/osv-scanner.toml" .
