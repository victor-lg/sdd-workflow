# Evaluaciones del plugin (M35, VIC-16). Solo corren sobre código ya
# fusionado en main, nunca en un PR: en una evaluación los hooks del plugin
# se ejecutan fuera del sandbox, y el token de la suscripción no debe llegar
# a código sin revisar. Los casos viven en plugin-sdd/evals/.
# Corren de madrugada y solo si el plugin cambió en el último día: consumen
# del mismo plan que el trabajo diario, y de día chocan con su límite.
name: evals

on:
  schedule:
    - cron: '17 2 * * *'   # 02:17 UTC, de madrugada en Madrid
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evals
  cancel-in-progress: false

jobs:
  evals:
    # También con workflow_dispatch: solo main, nunca otra rama.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: ¿Hay casos y, de madrugada, cambió el plugin?
        id: casos
        env:
          EVENTO: ${{ github.event_name }}
        run: |
          if [ "$EVENTO" = "schedule" ] && [ -z "$(git log --since='25 hours ago' --format=%h -- plugin-sdd)" ]; then
            echo "hay=no" >> "$GITHUB_OUTPUT"
            echo "El plugin no ha cambiado en el último día: nada que evaluar."
          elif [ -d plugin-sdd/evals ] && find plugin-sdd/evals -name prompt.md -o -name case.yaml | grep -q .; then
            echo "hay=si" >> "$GITHUB_OUTPUT"
          else
            echo "hay=no" >> "$GITHUB_OUTPUT"
            echo "Sin casos en plugin-sdd/evals: nada que evaluar."
          fi

      - name: Instalar Claude Code (versión fijada)
        if: steps.casos.outputs.hay == 'si'
        run: npm install -g @anthropic-ai/claude-code@2.1.307

      - name: Comprobar el secreto (sin mostrarlo)
        if: steps.casos.outputs.hay == 'si'
        env:
          T: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$T" ]; then echo "::error::El secreto CLAUDE_CODE_OAUTH_TOKEN está vacío"; exit 1; fi
          if printf '%s' "$T" | grep -q '[[:space:]]'; then echo "::error::El secreto tiene espacios o saltos de línea: vuelve a pegarlo en una sola línea"; exit 1; fi
          echo "Secreto presente: ${#T} caracteres, sin espacios."

      - name: Evaluar el plugin
        if: steps.casos.outputs.hay == 'si'
        working-directory: plugin-sdd
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude plugin eval . \
            --trust-plugin \
            --json "$RUNNER_TEMP/resultados-evals.json" \
            --keep-temp \
            --threshold 0.8 \
            --model claude-sonnet-5-5 \
            --judge-model claude-haiku-5-5 \
            --ablation none \
            --no-publish \
            --max-cost-usd 5

      - name: Resumen
        if: always() && steps.casos.outputs.hay == 'si'
        run: |
          python3 - "$RUNNER_TEMP/resultados-evals.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          try:
              r = json.load(open(sys.argv[1]))
          except Exception as e:
              print(f"Sin resultados legibles: {e}")
              sys.exit(0)
          print("### Evaluaciones del plugin")
          print(f"- Parcial: {r.get('partial', False)} {r.get('partialReason') or ''}")
          print(f"- Coste estimado: {r.get('costUsd', '?')} USD; duración: {r.get('durationSeconds', '?')} s")
          print("")
          print("| Caso | Puntuación |")
          print("| --- | --- |")
          for c in r.get("cases", []):
              print(f"| {c.get('name') or c.get('id') or '?'} | {(c.get('aggregates') or {}).get('score', '?')} |")
          errores = sorted({
              str(run.get("error")) for c in r.get("cases", [])
              for run in ((c.get("arms") or {}).get("with") or [])
              if run.get("error")
          })
          for e in errores:
              print(f"\n- Error de ejecución: `{e[:300]}`")
          # Detalle de los casos que no llegan a 1, para ver qué evaluador falla.
          for c in r.get("cases", []):
              score = (c.get("aggregates") or {}).get("score")
              if isinstance(score, (int, float)) and score < 1:
                  nombre = c.get("name") or c.get("id") or "?"
                  detalle = json.dumps(c, ensure_ascii=False, indent=1)[:6000]
                  print(f"\n<details><summary>Detalle de {nombre} ({score:.2f})</summary>\n\n```json\n{detalle}\n```\n</details>")
          PY

      # Resultados y la traza de cada ejecución como artefacto de 7 días, para
      # leer la respuesta final de un caso que no llega a 1 sin reproducirlo.
      - name: Reunir resultados y trazas (y buscar el token)
        id: reunir
        if: always() && steps.casos.outputs.hay == 'si'
        env:
          T: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/evals-artefacto/trazas"
          python3 - "$RUNNER_TEMP/resultados-evals.json" "$RUNNER_TEMP/evals-artefacto" <<'PY'
          import json, pathlib, shutil, sys
          src, dst = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          if not src.is_file():
              print("::warning::No hay resultados de la evaluación.")
              sys.exit(0)
          r = json.loads(src.read_text(encoding="utf-8"))
          shutil.copy(src, dst / "resultados-evals.json")
          copiadas = 0
          for c in r.get("cases", []):
              nombre = c.get("name") or "caso"
              for i, run in enumerate(((c.get("arms") or {}).get("with") or []), 1):
                  p = run.get("tracePath")
                  if p and pathlib.Path(p).is_file():
                      shutil.copy(p, dst / "trazas" / f"{nombre}-{i}.jsonl")
                      copiadas += 1
          if copiadas == 0:
              print("::warning::No se ha copiado ninguna traza (falta tracePath).")
          PY
          # Solo se sube si grep ha leído todo y no ha encontrado el token (sale con 1).
          # Busca sus 24 primeros caracteres y su base64; no detecta otras
          # transformaciones ni otros secretos.
          rc=1
          if [ -n "$T" ]; then
            b64="$(printf '%s' "$T" | base64 -w0 | tr -d '=')"
            rc=0
            grep -rqF -e "${T:0:24}" -e "$b64" -- "$RUNNER_TEMP/evals-artefacto" || rc=$?
          fi
          if [ "$rc" -ne 1 ]; then
            echo "::error::El token aparece en los resultados o no se ha podido comprobar; no se suben."
            rm -rf "$RUNNER_TEMP/evals-artefacto"
            exit 1
          fi

      - name: Subir resultados y trazas (7 días)
        if: always() && steps.reunir.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evals-${{ github.run_number }}
          path: ${{ runner.temp }}/evals-artefacto
          retention-days: 7
          if-no-files-found: warn
